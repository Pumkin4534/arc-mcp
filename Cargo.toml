[package]
name = "arc-mcp"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Evidence-led workflow tools for OpenCode"
license = "MIT"
repository = "https://github.com/Pumkin4534/arc-mcp"
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
ignore = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_System_JobObjects"] }

[profile.release]
lto = "thin"
strip = true
